name: Update contribution visualization

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate contribution graph
        env:
          GITHUB_USERNAME: matheus0967
          GH_TOKEN: ${{ secrets.GH_CONTRIBUTIONS_TOKEN }}
        run: python scripts/generate_activity.py

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/activity.svg
          git diff --cached --quiet || git commit -m "chore: update contribution visualization"
          git push
